<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Useless Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.calculator {
    width: 370px;
    padding: 25px;
    border-radius: 25px;
    background: #181818;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 20px;
}

.display {
    width: 100%;
    height: 75px;
    border: none;
    border-radius: 15px;
    background: #050505;
    color: #00ff88;
    font-size: 25px;
    padding: 15px;
    text-align: right;
    margin-bottom: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #333;
    color: white;
    transition: 0.15s;
}

button:hover {
    background: #444;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}

.operator {
    background: #ff9500;
}

.clear {
    background: #ff3b30;
}

.equals {
    background: #34c759;
}

.useless {
    grid-column: span 4;
    background: #9b59b6;
    font-size: 16px;
}

.result-box {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #242424;
    text-align: center;
}

.result {
    color: #00ff88;
    font-size: 19px;
    font-weight: bold;
}

.message {
    margin-top: 10px;
    color: #bbb;
    font-size: 14px;
}

.counter {
    margin-top: 12px;
    color: #666;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="calculator">

    <h1>🧮 Useless Calculator</h1>

    <p class="subtitle">
        It calculates. It just doesn't help.
    </p>

    <input
        id="display"
        class="display"
        value="0"
        readonly
    >

    <div class="buttons">

        <button class="clear" onclick="clearCalc()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="add('%')">%</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>

        <button class="useless" onclick="doNothing()">
            🚫 DO NOTHING
        </button>

    </div>

    <div class="result-box">

        <div class="result" id="result">
            Waiting for a useless calculation...
        </div>

        <div class="message" id="message">
            Your productivity is safe here.
        </div>

        <div class="counter" id="counter">
            Useless calculations: 0
        </div>

    </div>

</div>


<script>

const display = document.getElementById("display");
const result = document.getElementById("result");
const message = document.getElementById("message");
const counter = document.getElementById("counter");

let calculations = 0;


/* =========================
   ADD INPUT
========================= */

function add(value) {

    if (
        display.value === "0" ||
        display.value === "ERROR"
    ) {
        display.value = value;
    } else {
        display.value += value;
    }

}


/* =========================
   CLEAR
========================= */

function clearCalc() {

    display.value = "0";

    result.innerText =
        "Waiting for a useless calculation...";

    message.innerText =
        "Your productivity is safe here.";

}


/* =========================
   BACKSPACE
========================= */

function backspace() {

    if (display.value.length > 1) {

        display.value =
            display.value.slice(0, -1);

    } else {

        display.value = "0";

    }

}


/* =========================
   CALCULATE
========================= */

function calculate() {

    try {

        let expression = display.value;

        expression = expression.replace(
            /(\d+(?:\.\d+)?)%/g,
            "($1/100)"
        );

        /*
         * We calculate the real answer...
         * then completely ignore it.
         */

        let realAnswer = Function(
            '"use strict"; return (' +
            expression +
            ')'
        )();

        if (!Number.isFinite(realAnswer)) {
            throw new Error();
        }


        calculations++;

        counter.innerText =
            "Useless calculations: " +
            calculations;


        const uselessAnswers = [

            "42",

            "Probably 7",

            "Ask someone else",

            "¯\\_(ツ)_/¯",

            "Not important",

            "Maybe",

            "Definitely not",

            "ERROR: Purpose not found",

            "Approximately potato",

            "Who knows?",

            "Yesn't",

            "Calculation successful. Meaning: none.",

            "Your answer is outside the calculator",

            "This changes nothing",

            "Congratulations. You wasted time.",

            "The computer refuses to explain",

            "Try asking Google",

            "Result unavailable due to laziness",

            "Mathematically questionable",

            "Absolutely useless"

        ];


        const random =
            uselessAnswers[
                Math.floor(
                    Math.random() *
                    uselessAnswers.length
                )
            ];


        display.value = random;

        result.innerText =
            "Result: " + random;


        const messages = [

            "That was completely unnecessary.",

            "Excellent. You achieved nothing.",

            "Your calculator is disappointed.",

            "This information will help nobody.",

            "Congratulations on wasting 3 seconds.",

            "Please don't use this for homework.",

            "A normal calculator would have been better.",

            "Science has been notified.",

            "Your calculation has been rejected.",

            "This is why computers need supervision."

        ];


        message.innerText =
            messages[
                Math.floor(
                    Math.random() *
                    messages.length
                )
            ];


    } catch {

        display.value = "ERROR";

        result.innerText =
            "Even this useless calculator broke.";

        message.innerText =
            "Impressive.";

    }

}


/* =========================
   DO NOTHING
========================= */

function doNothing() {

    const messages = [

        "Nothing happened.",

        "Correct. Nothing was done.",

        "Task completed: absolutely nothing.",

        "Congratulations.",

        "You successfully did nothing.",

        "This button works perfectly.",

        "No action detected.",

        "Productivity remains unchanged."

    ];


    message.innerText =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "." ||
            key === "%"
        ) {

            add(key);

        }

        if (key === "Enter") {
            calculate();
        }

        if (key === "Backspace") {
            backspace();
        }

        if (key === "Escape") {
            clearCalc();
        }

    }
);

</script>

</body>
</html>
